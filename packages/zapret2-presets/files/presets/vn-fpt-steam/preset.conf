# Steam in Vietnam (FPT Telecom). See README.md.
# Lines starting with # are ignored by zapret2-preset.
# Simple KEY=VALUE lines are set in /opt/zapret2/config;
# the NFQWS2_OPT block replaces the one in config.
NFQWS2_ENABLE=1
MODE_FILTER=hostlist
NFQWS2_PORTS_TCP=80,443
NFQWS2_PORTS_UDP=
NFQWS2_TCP_PKT_OUT=10
NFQWS2_TCP_PKT_IN=3
NFQWS2_OPT="
--filter-tcp=80 --filter-l7=http <HOSTLIST> --payload=http_req --lua-desync=fake:blob=fake_default_http:tcp_md5 --lua-desync=multidisorder:pos=method+2,midsld --new
--filter-tcp=443 --filter-l7=tls <HOSTLIST> --payload=tls_client_hello --lua-desync=multisplit:pos=1,midsld
"
